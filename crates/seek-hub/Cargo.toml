[package]
name = "seek-hub"
description = "Seek Hub: always-on home server that stores every PC's encrypted file-name index"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "seek-hub"
path = "src/main.rs"

[dependencies]
seek-core.workspace = true
seek-sync.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs, for `doctor`'s free-disk check
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# paused clock for the session's idle stretch
tokio = { workspace = true, features = ["test-util"] }
