[package]
name = "seek-clean"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
# The job and result files of the admin step. Was dev-only.
serde_json = { workspace = true }
# The elevated side reads devices.json with the service's own types (OS-agnostic crate).
seek-core = { workspace = true }
# Review tokens are random; already in the workspace (seek-hub, seek-sync).
rand = { workspace = true }
# Duplicate finder: equality is the full BLAKE3 hash of the whole file (named by the spec).
blake3 = { workspace = true }
# Installed-app icons are sent to the window as PNG data URLs. 0.18.1 is already in Cargo.lock (tauri).
png = "0.18"
# The same icons, base64-encoded; already a workspace dependency.
base64 = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# The `#[implement]` macro expands to paths through the `windows_core` crate by name. Same
# 0.62.x already in the lock file through `windows`, so no second copy.
windows-core = "0.62"

[features]
# Exposes `recycle::observe_recycle`, which can destroy files. For the real spike tests only.
spike = []

[dev-dependencies]
tempfile = { workspace = true }
