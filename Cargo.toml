[workspace]
resolver = "2"
members = ["crates/seek-core", "crates/seek-scan", "crates/seek-ipc", "crates/seek-service", "crates/seek-cli", "crates/seek-sync", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
seek-core = { path = "crates/seek-core" }
seek-scan = { path = "crates/seek-scan" }
seek-ipc = { path = "crates/seek-ipc" }
seek-sync = { path = "crates/seek-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rayon = "1"
memchr = "2"
regex = "1"
zstd = "0.13"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jwalk = "0.8"
notify = "8"
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_Registry"] }
criterion = "0.5"
tempfile = "3"
snow = "0.9"
spake2 = "0.4"
chacha20poly1305 = "0.10"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
mdns-sd = "0.13"

# Everyday release builds compile in parallel and incrementally. The installer script turns on
# thin LTO and a single codegen unit (a few percent faster, much slower to build) via env vars.
[profile.release]
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.bench]
debug = true
